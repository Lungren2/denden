<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Den Den's typefaces, the same as T3 Code's: Inter for text (T3 asks for
     "Inter Variable", then system-ui), Cascadia Code for code, as in the
     terminal. ~/.config/fontconfig/fonts.conf can prefer others. -->
<fontconfig>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer><family>Cascadia Code</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Cascadia Code</family></prefer>
  </alias>
</fontconfig>
